<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmados — Festa Dona Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cream: #f7f1e3;
            --gold: #c9a876;
            --gold-deep: #a8865a;
            --ink: #2a2017;
            --ink-soft: #6b5a4a;
            --line: rgba(168, 134, 90, 0.2);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        .wrap { max-width: 800px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
        }
        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 2.2rem;
            margin-bottom: 0.4rem;
        }
        header p { color: var(--ink-soft); font-size: 0.9rem; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 14px -8px rgba(42, 32, 23, 0.1);
        }
        .stat-num {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.8rem;
            color: var(--gold-deep);
            line-height: 1;
        }
        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin-top: 0.3rem;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.5rem 1rem;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.82rem;
            font-family: inherit;
            color: var(--ink);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--gold-deep); }
        .filter-btn.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }

        .lista { display: flex; flex-direction: column; gap: 0.5rem; }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0.85rem 1.2rem;
            box-shadow: 0 2px 8px -4px rgba(42, 32, 23, 0.08);
            transition: all 0.15s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -4px rgba(42, 32, 23, 0.12);
            border-color: var(--gold);
        }
        .card-linha {
            display: grid;
            grid-template-columns: 130px 1fr auto auto;
            align-items: center;
            gap: 0.6rem;
        }
        .data-linha {
            font-size: 0.72rem;
            color: var(--ink-soft);
            opacity: 0.7;
            white-space: nowrap;
        }
        .nome {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .detalhe-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.6rem;
            background: var(--cream);
            border-radius: 6px;
            font-size: 0.78rem;
            color: var(--ink-soft);
            white-space: nowrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .badge-sim {
            background: #d4ead2;
            color: #2d5e2f;
        }
        .badge-nao {
            background: #f5d8d4;
            color: #8a2c1f;
        }
        .card-expandido {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--line);
            display: none;
        }
        .card-expandido.visible { display: block; }
        .acompanhantes {
            font-size: 0.88rem;
            color: var(--ink-soft);
            margin-bottom: 0.5rem;
        }
        .acompanhantes strong { color: var(--ink); }
        .mensagem {
            font-style: italic;
            color: var(--ink-soft);
            font-size: 0.85rem;
            padding: 0.5rem 0.8rem;
            background: #fdfaf4;
            border-radius: 6px;
            border-left: 3px solid var(--gold);
        }
        .data {
            font-size: 0.7rem;
            color: var(--ink-soft);
            opacity: 0.7;
            margin-top: 0.5rem;
        }
        .card-expandido > * + * { margin-top: 0.5rem; }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 0.45rem 0.85rem;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--gold-deep);
            background: #fdfaf4;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination button.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }
        .pagination .info {
            font-size: 0.8rem;
            color: var(--ink-soft);
            padding: 0 0.5rem;
        }

        .controles {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .busca {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
        }
        .busca:focus {
            outline: none;
            border-color: var(--gold);
        }
        .ordenacao {
            padding: 0.6rem 1rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
        }
        .ordenacao:focus {
            outline: none;
            border-color: var(--gold);
        }

        .empty, .loading, .error {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--ink-soft);
            font-size: 0.95rem;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--line);
            border-top-color: var(--gold-deep);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #b33a2a; }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 0.8rem;
        }
        footer a {
            color: var(--gold-deep);
            text-decoration: none;
        }

        /* Modal de Edição */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.visible {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 14px;
            padding: 1.8rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: var(--ink);
        }
        .modal .form-group {
            margin-bottom: 1rem;
        }
        .modal label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #fff;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        .modal textarea {
            min-height: 80px;
            resize: vertical;
        }
        .acomp-edit-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }
        .acomp-edit-row input {
            flex: 1;
        }
        .acomp-edit-row button {
            padding: 0.5rem 0.7rem;
            background: #f5d8d4;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #8a2c1f;
            font-size: 1rem;
        }
        .btn-add-acomp {
            background: #d4ead2;
            color: #2d5e2f;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }
        .modal-actions button {
            flex: 1;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-cancelar {
            background: #f0f0f0;
            color: var(--ink);
        }
        .btn-salvar {
            background: var(--gold);
            color: #fff;
        }
        .btn-salvar:hover {
            background: var(--gold-deep);
        }
        .btn-editar {
            padding: 0.3rem 0.6rem;
            background: none;
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--ink-soft);
            margin-left: 0.5rem;
        }
        .btn-editar:hover {
            background: #faf3e2;
            border-color: var(--gold);
        }

        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .nome { font-size: 1.05rem; }
            header h1 { font-size: 1.7rem; }
            .card-linha {
                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;
            }
            .data-linha {
                grid-column: 1;
                grid-row: 2;
                font-size: 0.68rem;
                margin-top: 0.3rem;
            }
            .badge {
                grid-column: 2;
                grid-row: 1;
            }
            .controles {
                flex-direction: column;
            }
            .busca { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Confirmações</h1>
            <p>Festa Dona Maria — 60 Anos</p>
        </header>

        <!-- ESTATÍSTICAS -->
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="stat-total">—</div>
                <div class="stat-label">Total respostas</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="stat-sim">—</div>
                <div class="stat-label">Confirmados</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="stat-nao">—</div>
                <div class="stat-label">Não vão</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="stat-pessoas">—</div>
                <div class="stat-label">Pessoas total*</div>
            </div>
        </div>
        <p style="text-align: center; font-size: 0.75rem; color: var(--ink-soft); margin: -1rem 0 1.2rem; opacity: 0.7;">
            *inclui acompanhantes
        </p>

        <!-- CONTROLES -->
        <div class="controles">
            <input type="text" class="busca" id="busca" placeholder="Buscar por nome..." />
            <select class="ordenacao" id="ordenacao">
                <option value="data-desc">Mais recentes primeiro</option>
                <option value="data-asc">Mais antigos primeiro</option>
                <option value="nome-asc">Nome A → Z</option>
                <option value="nome-desc">Nome Z → A</option>
            </select>
        </div>

        <!-- FILTROS -->
        <div class="filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="Sim">Confirmados</button>
            <button class="filter-btn" data-filter="Não">Não vão</button>
        </div>

        <!-- LISTA -->
        <div id="lista" class="lista">
            <div class="loading"><span class="spinner"></span> Carregando confirmações...</div>
        </div>

        <!-- PAGINAÇÃO -->
        <div class="pagination" id="pagination"></div>

        <footer>
            <a href="/gerar.html">🔗 Gerar Links</a> · <a href="/confirmados.html">📋 Confirmados</a> · <span style="opacity:0.5">Atualiza automaticamente</span>
        </footer>
    </div>

    <!-- Modal de Edição -->
    <div class="modal-overlay" id="modal-editar">
        <div class="modal">
            <h3>✏️ Editar Confirmação</h3>
            <form id="form-editar">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="edit-nome" />
                </div>
                <div class="form-group">
                    <label>Presença</label>
                    <select id="edit-presenca">
                        <option value="Sim">🌸 Confirmou</option>
                        <option value="Não">🌱 Não vai</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantidade de Acompanhantes</label>
                    <select id="edit-qtd-acomp">
                        <option value="0">Nenhum</option>
                        <option value="1">1 pessoa</option>
                        <option value="2">2 pessoas</option>
                        <option value="3">3 pessoas</option>
                        <option value="4">4 pessoas</option>
                        <option value="5">5 pessoas</option>
                        <option value="6">6 pessoas</option>
                        <option value="7">7 pessoas</option>
                        <option value="8">8 pessoas</option>
                        <option value="9">9 pessoas</option>
                        <option value="10">10 pessoas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nomes dos Acompanhantes</label>
                    <div id="edit-acompanhantes"></div>
                    <button type="button" class="btn-add-acomp" onclick="addAcompEditRow()">+ Adicionar acompanhante</button>
                </div>
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea id="edit-mensagem" placeholder="Mensagem para a Maria..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qhkcilqktcdevkkysovp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoa2NpbHFrdGNkZXZra3lzb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTk5NzksImV4cCI6MjEwMDMzNTk3OX0.gGg83qvinqHsZkdRacGYVRheCwawWeUKAHCiEpni9LU';

        const listaEl = document.getElementById('lista');
        const paginationEl = document.getElementById('pagination');
        const buscaEl = document.getElementById('busca');
        const ordenacaoEl = document.getElementById('ordenacao');
        let allData = [];
        let currentFilter = 'todos';
        let currentBusca = '';
        let currentOrdenacao = 'data-desc';
        let currentPage = 1;
        const ITEMS_PER_PAGE = 15;

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleDateString('pt-BR', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function renderStats(data) {
            const sim = data.filter(d => d.presenca === 'Sim').length;
            const nao = data.filter(d => d.presenca === 'Não').length;
            const pessoas = data
                .filter(d => d.presenca === 'Sim')
                .reduce((acc, d) => acc + 1 + (parseInt(d.qtd_dependentes) || 0), 0);
            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-sim').textContent = sim;
            document.getElementById('stat-nao').textContent = nao;
            document.getElementById('stat-pessoas').textContent = pessoas;
        }

        function renderList() {
            // Filtra por status
            let filtered = currentFilter === 'todos'
                ? [...allData]
                : allData.filter(d => d.presenca === currentFilter);

            // Filtra por nome
            if (currentBusca.trim()) {
                const termo = currentBusca.toLowerCase().trim();
                filtered = filtered.filter(d =>
                    d.nome.toLowerCase().includes(termo) ||
                    (d.acompanhantes && d.acompanhantes.toLowerCase().includes(termo))
                );
            }

            if (filtered.length === 0) {
                listaEl.innerHTML = '<div class="empty">Nenhuma confirmação encontrada.</div>';
                paginationEl.innerHTML = '';
                return;
            }

            // Ordena
            filtered.sort((a, b) => {
                switch (currentOrdenacao) {
                    case 'data-asc':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'data-desc':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'nome-asc':
                        return a.nome.localeCompare(b.nome, 'pt-BR');
                    case 'nome-desc':
                        return b.nome.localeCompare(a.nome, 'pt-BR');
                    default:
                        return 0;
                }
            });

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = filtered.slice(start, end);

            listaEl.innerHTML = pageItems.map((d) => {
                const badgeClass = d.presenca === 'Sim' ? 'badge-sim' : 'badge-nao';
                const badgeIcon = d.presenca === 'Sim' ? '✓' : '✕';
                const badgeText = d.presenca === 'Sim' ? 'Confirmou' : 'Não vai';

                const qtdDep = parseInt(d.qtd_dependentes) || 0;
                const totalPessoas = qtdDep + 1;
                const temAcompanhantes = d.acompanhantes && d.acompanhantes.trim().length > 0;
                const temInfoExtra = temAcompanhantes || (d.mensagem && d.mensagem.trim());

                // Separa nomes dos acompanhantes
                const nomesAcompanhantes = temAcompanhantes
                    ? d.acompanhantes.split(';').map(n => n.trim()).filter(n => n)
                    : [];

                return `
                    <div class="card" onclick="toggleExpand(event, this)" data-id="${escapeHtml(d.id || d.nome)}">
                        <div class="card-linha">
                            <span class="data-linha">${formatDate(d.created_at)}</span>
                            <span class="nome">${escapeHtml(d.nome)}</span>
                            ${d.presenca === 'Sim' && qtdDep > 0 ? `
                                <span class="detalhe-pill">
                                    👥 ${totalPessoas} ${totalPessoas === 1 ? 'pessoa' : 'pessoas'}
                                </span>
                            ` : ''}
                            <span class="badge ${badgeClass}">${badgeIcon} ${badgeText}</span>
                            <button class="btn-editar" onclick="event.stopPropagation(); abrirModalEdicao('${escapeHtml(d.id || d.nome)}')">✏️ Editar</button>
                        </div>
                        <div class="card-expandido">
                            ${nomesAcompanhantes.length > 0 ? `
                                <div class="acompanhantes">
                                    <strong>Acompanhantes:</strong>
                                    <ul style="margin: 0.5rem 0 0 1.2rem; padding: 0;">
                                        ${nomesAcompanhantes.map(n => `<li style="margin-bottom: 0.25rem;">${escapeHtml(n)}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            ${d.mensagem && d.mensagem.trim() ? `
                                <div class="mensagem">"${escapeHtml(d.mensagem)}"</div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages, filtered.length, start, end);
        }

        function renderPagination(totalPages, totalItems, start, end) {
            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Anterior</button>
            `;

            // Limita números de páginas visíveis
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<span class="info">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" ${i === currentPage ? 'class="active"' : ''}>${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="info">...</span>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Próxima →</button>`;

            paginationEl.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleExpand(event, card) {
            // Não expande se clicou no botão de editar
            if (event.target.closest('.btn-editar')) return;
            const expandido = card.querySelector('.card-expandido');
            if (!expandido) return;
            expandido.classList.toggle('visible');
        }

        // ===== MODAL DE EDIÇÃO =====
        let editandoId = null;

        function abrirModalEdicao(id) {
            editandoId = id;
            const item = allData.find(d => (d.id || d.nome) === id);
            if (!item) return;

            document.getElementById('edit-nome').value = item.nome || '';
            document.getElementById('edit-presenca').value = item.presenca || 'Sim';
            document.getElementById('edit-mensagem').value = item.mensagem || '';

            const qtd = parseInt(item.qtd_dependentes) || 0;
            document.getElementById('edit-qtd-acomp').value = qtd;

            // Renderiza campos de acompanhantes
            renderAcompEditRows(qtd, item.acompanhantes);

            document.getElementById('modal-editar').classList.add('visible');
        }

        function renderAcompEditRows(qtd, acompanhantesStr) {
            const container = document.getElementById('edit-acompanhantes');
            const nomes = acompanhantesStr ? acompanhantesStr.split(';').map(n => n.trim()).filter(n => n) : [];
            container.innerHTML = '';

            for (let i = 0; i < qtd; i++) {
                addAcompEditRow(nomes[i] || '');
            }
        }

        function addAcompEditRow(valor = '') {
            const container = document.getElementById('edit-acompanhantes');
            const row = document.createElement('div');
            row.className = 'acomp-edit-row';
            row.innerHTML = `
                <input type="text" placeholder="Nome do acompanhante" value="${escapeHtml(valor)}" />
                <button type="button" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }

        function fecharModal() {
            document.getElementById('modal-editar').classList.remove('visible');
            editandoId = null;
        }

        document.getElementById('edit-qtd-acomp').addEventListener('change', function() {
            const qtd = parseInt(this.value);
            renderAcompEditRows(qtd, '');
        });

        document.getElementById('form-editar').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nome = document.getElementById('edit-nome').value.trim();
            const presenca = document.getElementById('edit-presenca').value;
            const qtdAcomp = parseInt(document.getElementById('edit-qtd-acomp').value);
            const mensagem = document.getElementById('edit-mensagem').value.trim();

            // Coleta nomes dos acompanhantes
            const acompInputs = document.querySelectorAll('#edit-acompanhantes input');
            const acompNomes = Array.from(acompInputs)
                .map(i => i.value.trim())
                .filter(n => n);
            const acompanhantesStr = acompNomes.join('; ');

            const data = {
                nome: nome,
                presenca: presenca,
                qtd_dependentes: qtdAcomp,
                acompanhantes: acompanhantesStr,
                mensagem: mensagem
            };

            try {
                // Usa upsert pelo nome_normalizado
                const nomeNormalizado = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '_');

                const res = await fetch(`${SUPABASE_URL}/rest/v1/confirmacoes?nome_normalizado=eq.${encodeURIComponent(nomeNormalizado)}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('HTTP ' + res.status);

                fecharModal();
                carregar(); // Recarrega a lista

            } catch (err) {
                console.error('Erro ao salvar:', err);
                alert('Erro ao salvar. Tente novamente.');
            }
        });

        async function carregar() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/confirmacoes?select=*&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    }
                );

                if (!res.ok) throw new Error('HTTP ' + res.status);

                allData = await res.json();
                renderStats(allData);
                renderList();

            } catch (err) {
                console.error('Erro:', err);
                listaEl.innerHTML = `<div class="error">Erro ao carregar: ${err.message}</div>`;
            }
        }

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                renderList();
            });
        });

        // Busca por nome
        buscaEl.addEventListener('input', () => {
            currentBusca = buscaEl.value;
            currentPage = 1;
            renderList();
        });

        // Ordenação
        ordenacaoEl.addEventListener('change', () => {
            currentOrdenacao = ordenacaoEl.value;
            currentPage = 1;
            renderList();
        });

        // Atualiza a cada 30s
        carregar();
        setInterval(carregar, 30000);
    </script>
</body>
</html>
