<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmados — Festa Dona Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cream: #f7f1e3;
            --gold: #c9a876;
            --gold-deep: #a8865a;
            --ink: #2a2017;
            --ink-soft: #6b5a4a;
            --line: rgba(168, 134, 90, 0.2);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        .wrap { max-width: 800px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
        }
        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 2.2rem;
            margin-bottom: 0.4rem;
        }
        header p { color: var(--ink-soft); font-size: 0.9rem; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 14px -8px rgba(42, 32, 23, 0.1);
        }
        .stat-num {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.8rem;
            color: var(--gold-deep);
            line-height: 1;
        }
        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin-top: 0.3rem;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.5rem 1rem;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.82rem;
            font-family: inherit;
            color: var(--ink);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--gold-deep); }
        .filter-btn.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }

        .lista { display: flex; flex-direction: column; gap: 0.5rem; }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0.85rem 1.2rem;
            box-shadow: 0 2px 8px -4px rgba(42, 32, 23, 0.08);
            transition: all 0.15s;
            cursor: pointer;
        }
        .card:hover { 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -4px rgba(42, 32, 23, 0.12);
            border-color: var(--gold);
        }
        .card-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .card-esquerda {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }
        .nome {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .data-linha {
            font-size: 0.72rem;
            color: var(--ink-soft);
            opacity: 0.7;
            white-space: nowrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .badge-sim {
            background: #d4ead2;
            color: #2d5e2f;
        }
        .badge-nao {
            background: #f5d8d4;
            color: #8a2c1f;
        }
        .detalhe-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.6rem;
            background: var(--cream);
            border-radius: 6px;
            font-size: 0.78rem;
            color: var(--ink-soft);
            flex-shrink: 0;
        }
        .card-expandido {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--line);
            display: none;
        }
        .card-expandido.visible { display: block; }
        .acompanhantes {
            font-size: 0.88rem;
            color: var(--ink-soft);
            margin-bottom: 0.5rem;
        }
        .acompanhantes strong { color: var(--ink); }
        .mensagem {
            font-style: italic;
            color: var(--ink-soft);
            font-size: 0.85rem;
            padding: 0.5rem 0.8rem;
            background: #fdfaf4;
            border-radius: 6px;
            border-left: 3px solid var(--gold);
        }
        .data {
            font-size: 0.7rem;
            color: var(--ink-soft);
            opacity: 0.7;
            margin-top: 0.5rem;
        }
        .card-expandido > * + * { margin-top: 0.5rem; }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 0.45rem 0.85rem;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--gold-deep);
            background: #fdfaf4;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination button.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }
        .pagination .info {
            font-size: 0.8rem;
            color: var(--ink-soft);
            padding: 0 0.5rem;
        }

        .empty, .loading, .error {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--ink-soft);
            font-size: 0.95rem;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--line);
            border-top-color: var(--gold-deep);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #b33a2a; }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 0.8rem;
        }
        footer a {
            color: var(--gold-deep);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .nome { font-size: 1.2rem; }
            header h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Confirmações</h1>
            <p>Festa Dona Maria — 60 Anos</p>
        </header>

        <!-- ESTATÍSTICAS -->
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="stat-total">—</div>
                <div class="stat-label">Total respostas</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="stat-sim">—</div>
                <div class="stat-label">Confirmados</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="stat-nao">—</div>
                <div class="stat-label">Não vão</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="stat-pessoas">—</div>
                <div class="stat-label">Pessoas total*</div>
            </div>
        </div>
        <p style="text-align: center; font-size: 0.75rem; color: var(--ink-soft); margin: -1rem 0 1.2rem; opacity: 0.7;">
            *inclui acompanhantes
        </p>

        <!-- FILTROS -->
        <div class="filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="Sim">Confirmados</button>
            <button class="filter-btn" data-filter="Não">Não vão</button>
        </div>

        <!-- LISTA -->
        <div id="lista" class="lista">
            <div class="loading"><span class="spinner"></span> Carregando confirmações...</div>
        </div>

        <!-- PAGINAÇÃO -->
        <div class="pagination" id="pagination"></div>

        <footer>
            <a href="/gerar.html">🔗 Gerar Links</a> · <a href="/confirmados.html">📋 Confirmados</a> · <span style="opacity:0.5">Atualiza automaticamente</span>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://qhkcilqktcdevkkysovp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoa2NpbHFrdGNkZXZra3lzb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTk5NzksImV4cCI6MjEwMDMzNTk3OX0.gGg83qvinqHsZkdRacGYVRheCwawWeUKAHCiEpni9LU';

        const listaEl = document.getElementById('lista');
        const paginationEl = document.getElementById('pagination');
        let allData = [];
        let currentFilter = 'todos';
        let currentPage = 1;
        const ITEMS_PER_PAGE = 15;

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleDateString('pt-BR', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function renderStats(data) {
            const sim = data.filter(d => d.presenca === 'Sim').length;
            const nao = data.filter(d => d.presenca === 'Não').length;
            const pessoas = data
                .filter(d => d.presenca === 'Sim')
                .reduce((acc, d) => acc + 1 + (parseInt(d.qtd_dependentes) || 0), 0);
            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-sim').textContent = sim;
            document.getElementById('stat-nao').textContent = nao;
            document.getElementById('stat-pessoas').textContent = pessoas;
        }

        function renderList() {
            const filtered = currentFilter === 'todos'
                ? allData
                : allData.filter(d => d.presenca === currentFilter);

            if (filtered.length === 0) {
                listaEl.innerHTML = '<div class="empty">Nenhuma confirmação ainda. Aguardando respostas...</div>';
                paginationEl.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = filtered.slice(start, end);

            listaEl.innerHTML = pageItems.map((d) => {
                const badgeClass = d.presenca === 'Sim' ? 'badge-sim' : 'badge-nao';
                const badgeIcon = d.presenca === 'Sim' ? '✓' : '✕';
                const badgeText = d.presenca === 'Sim' ? 'Confirmou' : 'Não vai';

                const qtdDep = parseInt(d.qtd_dependentes) || 0;
                const totalPessoas = qtdDep + 1;
                const temAcompanhantes = d.acompanhantes && d.acompanhantes.trim().length > 0;
                const temInfoExtra = temAcompanhantes || (d.mensagem && d.mensagem.trim());

                return `
                    <div class="card" onclick="toggleExpand(this)" ${!temInfoExtra ? 'style="cursor:default"' : ''}>
                        <div class="card-linha">
                            <span class="data-linha">${formatDate(d.created_at)}</span>
                            <span class="nome">${escapeHtml(d.nome)}</span>
                            ${d.presenca === 'Sim' && qtdDep > 0 ? `
                                <span class="detalhe-pill">
                                    👥 ${totalPessoas} ${totalPessoas === 1 ? 'pessoa' : 'pessoas'}
                                </span>
                            ` : ''}
                            <span class="badge ${badgeClass}">${badgeIcon} ${badgeText}</span>
                        </div>
                        <div class="card-expandido">
                            ${temAcompanhantes ? `
                                <div class="acompanhantes">
                                    <strong>Acompanhantes:</strong> ${escapeHtml(d.acompanhantes)}
                                </div>
                            ` : ''}
                            ${d.mensagem && d.mensagem.trim() ? `
                                <div class="mensagem">"${escapeHtml(d.mensagem)}"</div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages, filtered.length, start, end);
        }

        function renderPagination(totalPages, totalItems, start, end) {
            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Anterior</button>
            `;

            // Limita números de páginas visíveis
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<span class="info">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" ${i === currentPage ? 'class="active"' : ''}>${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="info">...</span>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Próxima →</button>`;

            paginationEl.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleExpand(card) {
            const expandido = card.querySelector('.card-expandido');
            if (!expandido) return;
            expandido.classList.toggle('visible');
        }

        async function carregar() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/confirmacoes?select=*&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    }
                );

                if (!res.ok) throw new Error('HTTP ' + res.status);

                allData = await res.json();
                renderStats(allData);
                renderList();

            } catch (err) {
                console.error('Erro:', err);
                listaEl.innerHTML = `<div class="error">Erro ao carregar: ${err.message}</div>`;
            }
        }

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                renderList();
            });
        });

        // Atualiza a cada 30s
        carregar();
        setInterval(carregar, 30000);
    </script>
</body>
</html>
