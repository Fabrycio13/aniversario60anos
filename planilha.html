<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilha — Festa Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cream: #f7f1e3;
            --gold: #c9a876;
            --gold-deep: #a8865a;
            --ink: #2a2017;
            --ink-soft: #6b5a4a;
            --line: rgba(168, 134, 90, 0.2);
            --success: #2e7d32;
            --warning: #f57c00;
            --danger: #c62828;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1rem 2rem 8rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }
        header p {
            color: var(--ink-soft);
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        .sidebar {
            position: fixed;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: #fff;
            border: 1px solid var(--gold);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--ink-soft);
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(197, 158, 78, 0.15);
            white-space: nowrap;
        }
        .nav-btn:hover {
            background: rgba(197, 158, 78, 0.1);
            transform: translateX(3px);
        }
        .nav-btn.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #fff;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-card .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink);
        }
        .stat-card.success .value { color: var(--success); }
        .stat-card.warning .value { color: var(--warning); }

        .toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.6rem 1rem;
            background: var(--ink);
            color: var(--cream);
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--gold-deep); }
        button.success { background: var(--success); }
        button.danger { background: var(--danger); }
        button.outline {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
        }
        button.outline:hover { background: rgba(0,0,0,0.05); }

        .table-container {
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--line);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: var(--ink);
            color: var(--cream);
            padding: 0.8rem 0.5rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        th:first-child { border-radius: 12px 0 0 0; }
        th:last-child { border-radius: 0 12px 0 0; }
        td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        tr:hover td { background: rgba(197, 158, 78, 0.05); }
        tr:last-child td { border-bottom: none; }
        
        .editable {
            min-width: 100px;
            padding: 0.4rem 0.5rem;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: text;
            transition: all 0.2s;
        }
        .editable:hover {
            border-color: var(--gold);
            background: rgba(197, 158, 78, 0.1);
        }
        .editable:focus {
            outline: none;
            border-color: var(--gold-deep);
            background: #fff;
            box-shadow: 0 0 0 2px rgba(197, 158, 78, 0.2);
        }
        
        .cell-presenca {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .cell-presenca.sim {
            background: #e8f5e9;
            color: var(--success);
        }
        .cell-presenca.nao {
            background: #ffebee;
            color: var(--danger);
        }
        .cell-presenca.editing {
            background: #fff;
            border: 1px solid var(--gold);
            padding: 0;
        }
        .cell-presenca select {
            padding: 0.3rem 0.5rem;
            border: none;
            background: transparent;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }
        
        .cell-qtd {
            font-weight: 600;
            color: var(--ink);
            min-width: 60px;
            text-align: center;
        }
        
        .actions {
            white-space: nowrap;
        }
        .actions button {
            padding: 0.35rem 0.6rem;
            font-size: 0.75rem;
            margin-right: 0.3rem;
        }
        .actions .del { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .actions .del:hover { background: var(--danger); color: #fff; }

        .add-row {
            background: #fafafa;
        }
        .add-row td {
            padding: 1rem 0.5rem;
        }
        .add-row button {
            width: 100%;
        }

        .cell-date {
            font-size: 0.8rem;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .cell-acompanhantes {
            max-width: 200px;
            font-size: 0.85rem;
            color: var(--ink-soft);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copied-toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--cream);
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .copied-toast.show { opacity: 1; }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--ink-soft);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                transform: none;
                margin-bottom: 1rem;
            }
            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .wrap {
                padding: 1rem;
            }
            .editable {
                min-width: 80px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="/gerar.html" class="nav-btn">🔗 Gerar Links</a>
            <a href="/confirmados.html" class="nav-btn">📋 Confirmados</a>
            <a href="/planilha.html" class="nav-btn active">📊 Planilha</a>
        </nav>
    </aside>

    <div class="wrap">
        <header>
            <h1>Planilha de Confirmações</h1>
            <p>Festa Maria — 60 Anos</p>
        </header>

        <div class="stats-bar" id="stats">
            <div class="stat-card">
                <div class="label">Total Confirmados</div>
                <div class="value" id="total-confirmados">0</div>
            </div>
            <div class="stat-card success">
                <div class="label">Confirmados (Sim)</div>
                <div class="value" id="total-sim">0</div>
            </div>
            <div class="stat-card warning">
                <div class="label">Não Confirmados</div>
                <div class="value" id="total-nao">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Pessoas</div>
                <div class="value" id="total-pessoas">0</div>
            </div>
        </div>

        <div class="toolbar">
            <button onclick="adicionarLinha()">➕ Adicionar Linha</button>
            <button onclick="copiarDados()" class="outline">📋 Copiar Dados</button>
            <button onclick="location.reload()" class="outline">🔄 Atualizar</button>
        </div>

        <div class="table-container">
            <table id="planilha">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>Nome</th>
                        <th style="width: 80px;">Pessoas</th>
                        <th style="width: 100px;">Presença</th>
                        <th>Acompanhantes</th>
                        <th>Mensagem</th>
                        <th style="width: 130px;">Data</th>
                        <th style="width: 120px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
                <tfoot class="add-row">
                    <tr>
                        <td colspan="8">
                            <button onclick="adicionarLinha()">➕ Adicionar novo convidado manualmente</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="copied-toast" id="toast">Copiado!</div>

    <script>
        const SB_URL = 'https://qhkcilqktcdevkkysovp.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoa2NpbHFrdGNkZXZra3lzb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTk5NzksImV4cCI6MjEwMDMzNTk3OX0.gGg83qvinqHsZkdRacGYVRheCwawWeUKAHCiEpni9LU';

        function sbH() { return {
            'Content-Type': 'application/json',
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY
        }};

        let dados = [];

        function toastShow(m) {
            const t = document.getElementById('toast');
            t.textContent = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function formatDate(d) {
            if (!d) return '-';
            const date = new Date(d);
            return date.toLocaleDateString('pt-BR', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function atualizarStats() {
            const sim = dados.filter(d => d.presenca === 'Sim').length;
            const nao = dados.filter(d => d.presenca === 'Não').length;
            const pessoas = dados.reduce((acc, d) => {
                if (d.presenca === 'Sim') return acc + 1 + (parseInt(d.qtd_dependentes) || 0);
                return acc;
            }, 0);

            document.getElementById('total-confirmados').textContent = dados.length;
            document.getElementById('total-sim').textContent = sim;
            document.getElementById('total-nao').textContent = nao;
            document.getElementById('total-pessoas').textContent = pessoas;
        }

        function render() {
            const tbody = document.getElementById('table-body');
            
            if (dados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <div class="icon">📋</div>
                                <p>Nenhuma confirmação ainda.</p>
                                <p style="font-size: 0.85rem;">Adicione uma linha ou aguarde os convidados confirmarem pelo link.</p>
                            </div>
                        </td>
                    </tr>`;
                atualizarStats();
                return;
            }

            tbody.innerHTML = dados.map((d, i) => `
                <tr data-id="${d.id}" data-index="${i}">
                    <td style="text-align: center; color: var(--ink-soft); font-size: 0.8rem;">${i + 1}</td>
                    <td>
                        <span class="editable" contenteditable="true" 
                              onblur="salvarCelula(${d.id}, 'nome', this.textContent)"
                              onclick="this.focus()">${d.nome || ''}</span>
                    </td>
                    <td>
                        <span class="editable cell-qtd" contenteditable="true" 
                              onblur="salvarCelula(${d.id}, 'qtd_dependentes', this.textContent)"
                              onclick="this.focus()">${d.qtd_dependentes || 0}</span>
                    </td>
                    <td>
                        <span class="cell-presenca ${d.presenca === 'Sim' ? 'sim' : d.presenca === 'Não' ? 'nao' : ''}" 
                              id="presenca-${d.id}">
                            ${d.presenca || '-'}
                        </span>
                        <button class="outline" style="margin-left: 0.5rem; padding: 0.2rem 0.5rem; font-size: 0.7rem;"
                                onclick="togglePresenca(${d.id}, '${d.presenca === 'Sim' ? 'Não' : 'Sim'}')">
                            ↻
                        </button>
                    </td>
                    <td>
                        <span class="editable cell-acompanhantes" contenteditable="true" 
                              onblur="salvarCelula(${d.id}, 'acompanhantes', this.textContent)"
                              onclick="this.focus()" title="${d.acompanhantes || ''}">${d.acompanhantes || ''}</span>
                    </td>
                    <td>
                        <span class="editable" contenteditable="true" 
                              onblur="salvarCelula(${d.id}, 'mensagem', this.textContent)"
                              onclick="this.focus()">${d.mensagem || ''}</span>
                    </td>
                    <td class="cell-date">${formatDate(d.created_at)}</td>
                    <td class="actions">
                        <button class="outline" onclick="editarLinha(${d.id})">✏️</button>
                        <button class="del" onclick="deletarLinha(${d.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');

            atualizarStats();
        }

        async function carregar() {
            try {
                const r = await fetch(SB_URL + '/rest/v1/confirmacoes?select=*&order=created_at.desc', {
                    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
                });
                if (!r.ok) throw new Error('Erro ao carregar');
                dados = await r.json();
                render();
            } catch (e) {
                toastShow('Erro ao carregar dados');
                console.error(e);
            }
        }

        async function salvarCelula(id, campo, valor) {
            const idx = dados.findIndex(d => d.id === id);
            if (idx === -1) return;

            dados[idx][campo] = valor;

            try {
                await fetch(SB_URL + '/rest/v1/confirmacoes?id=eq.' + id, {
                    method: 'PATCH',
                    headers: sbH(),
                    body: JSON.stringify({ [campo]: valor })
                });
                toastShow('Salvo!');
            } catch (e) {
                toastShow('Erro ao salvar');
            }
        }

        async function togglePresenca(id, novoValor) {
            await salvarCelula(id, 'presenca', novoValor);
            const el = document.getElementById('presenca-' + id);
            if (el) {
                el.className = 'cell-presenca ' + (novoValor === 'Sim' ? 'sim' : 'nao');
                el.textContent = novoValor;
            }
            atualizarStats();
        }

        async function deletarLinha(id) {
            if (!confirm('Deletar esta confirmação?')) return;
            try {
                await fetch(SB_URL + '/rest/v1/confirmacoes?id=eq.' + id, {
                    method: 'DELETE',
                    headers: sbH()
                });
                dados = dados.filter(d => d.id !== id);
                render();
                toastShow('Deletado!');
            } catch (e) {
                toastShow('Erro ao deletar');
            }
        }

        async function adicionarLinha() {
            const nome = prompt('Nome do convidado:');
            if (!nome || !nome.trim()) return;

            const qtd = prompt('Quantidade de acompanhantes (0-20):', '0');
            if (qtd === null) return;
            
            const presenca = confirm('Confirmou presença?') ? 'Sim' : 'Não';

            const data = {
                nome: nome.trim(),
                nome_normalizado: nome.trim().toLowerCase(),
                presenca: presenca,
                qtd_dependentes: parseInt(qtd) || 0,
                acompanhantes: '',
                mensagem: ''
            };

            try {
                const r = await fetch(SB_URL + '/rest/v1/confirmacoes', {
                    method: 'POST',
                    headers: sbH(),
                    body: JSON.stringify(data)
                });
                if (!r.ok) throw new Error();
                await carregar();
                toastShow('Adicionado!');
            } catch (e) {
                toastShow('Erro ao adicionar');
            }
        }

        async function editarLinha(id) {
            const d = dados.find(x => x.id === id);
            if (!d) return;

            const nome = prompt('Nome:', d.nome);
            if (nome === null) return;

            const qtd = prompt('Qtd. acompanhantes:', d.qtd_dependentes);
            if (qtd === null) return;

            const presenca = confirm('Confirmou presença?') ? 'Sim' : 'Não';

            try {
                await fetch(SB_URL + '/rest/v1/confirmacoes?id=eq.' + id, {
                    method: 'PATCH',
                    headers: sbH(),
                    body: JSON.stringify({
                        nome: nome,
                        nome_normalizado: nome.toLowerCase(),
                        qtd_dependentes: parseInt(qtd) || 0,
                        presenca: presenca
                    })
                });
                await carregar();
                toastShow('Atualizado!');
            } catch (e) {
                toastShow('Erro ao atualizar');
            }
        }

        function copiarDados() {
            const headers = ['Nome', 'Pessoas', 'Presença', 'Acompanhantes', 'Mensagem', 'Data'];
            const rows = dados.map(d => [
                d.nome,
                (parseInt(d.qtd_dependentes) || 0) + 1,
                d.presenca,
                d.acompanhantes || '',
                d.mensagem || '',
                formatDate(d.created_at)
            ]);

            const text = [headers.join('\t'), ...rows.map(r => r.join('\t'))].join('\n');
            
            navigator.clipboard.writeText(text).then(() => {
                toastShow('Dados copiados!');
            }).catch(() => {
                toastShow('Erro ao copiar');
            });
        }

        // Carrega ao iniciar
        carregar();
    </script>
</body>
</html>
