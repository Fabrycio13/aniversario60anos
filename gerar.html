<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Links — Festa Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cream: #f7f1e3;
            --gold: #c9a876;
            --gold-deep: #a8865a;
            --ink: #2a2017;
            --ink-soft: #6b5a4a;
            --line: rgba(168, 134, 90, 0.2);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1rem 2rem 8rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }
        header p {
            color: var(--ink-soft);
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 6px 24px -10px rgba(42, 32, 23, 0.15);
            border: 1px solid var(--line);
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink);
            margin-bottom: 0.4rem;
        }
        .base-url {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: monospace;
            background: #fdfaf4;
        }
        textarea {
            width: 100%;
            min-height: 140px;
            padding: 0.8rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            background: #fdfaf4;
        }
        .row { display: flex; gap: 0.5rem; }
        .row textarea { flex: 1; }
        button {
            padding: 0.7rem 1.2rem;
            background: var(--ink);
            color: var(--cream);
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.06em;
            transition: background 0.2s;
        }
        button:hover { background: var(--gold-deep); }
        button.gold {
            background: var(--gold-deep);
        }
        button.gold:hover { background: var(--ink); }
        .links-list {
            max-height: 420px;
            overflow-y: auto;
            margin-top: 0.6rem;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--line);
        }
        .link-item:last-child { border-bottom: none; }
        .link-nome {
            min-width: 130px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            color: var(--ink);
            flex-shrink: 0;
        }
        .link-url {
            flex: 1;
            font-family: monospace;
            font-size: 0.78rem;
            color: var(--ink-soft);
            word-break: break-all;
            background: #fdfaf4;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--line);
            min-width: 0;
        }
        .copy-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.78rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .del-btn {
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            background: none;
            color: #c0392b;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .del-btn:hover {
            opacity: 1;
            background: #fce8e6;
        }
        .empty {
            color: var(--ink-soft);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
        }
        .counter {
            font-size: 0.85rem;
            color: var(--ink-soft);
            margin-bottom: 0.5rem;
            text-align: right;
        }
        .hint {
            font-size: 0.78rem;
            color: var(--ink-soft);
            margin-top: 0.5rem;
            line-height: 1.5;
        }
        .copied-toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--cream);
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .copied-toast.show { opacity: 1; }

        .sidebar {
            position: fixed;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: #fff;
            border: 1px solid var(--gold);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--ink-soft);
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(197, 158, 78, 0.15);
            white-space: nowrap;
        }
        .nav-btn:hover {
            background: rgba(197, 158, 78, 0.1);
            transform: translateX(3px);
        }
        .nav-btn.active {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                top: auto;
                left: auto;
                transform: none;
                margin-bottom: 1rem;
            }
            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .main-grid {
                flex-direction: column;
            }
            .card-col {
                width: 100%;
            }
        }

        .main-grid {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .card-col {
            flex: 1;
            min-width: 0;
        }
        .form-select {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            background: #fff;
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="/gerar.html" class="nav-btn active">🔗 Gerar Links</a>
            <a href="/confirmados.html" class="nav-btn">📋 Confirmados</a>
        </nav>
    </aside>

    <div class="wrap">
        <header>
            <h1>Gerador de Links</h1>
            <p>Festa Maria — 60 Anos</p>
        </header>

        <div class="main-grid">
            <!-- Coluna Esquerda: URL + Adicionar nomes -->
            <div class="card-col">
                <div class="card">
                    <label>URL base do convite</label>
                    <input type="text" id="baseUrl" class="base-url"
                           value="https://aniversario60anos.vercel.app/" />
                    <p class="hint">Mude aqui se o site estiver em outro domínio</p>
                </div>

                <div class="card">
                    <label>Adicionar nomes (um por linha)</label>
                    <p class="hint" style="margin-bottom: 0.8rem;">Use o formato: <strong>Nome - máximo</strong> (ex: Maria Silva - 3). Se não especificar, usa o padrão abaixo.</p>
                    <div class="row">
                        <textarea id="namesInput" placeholder="Maria Silva - 3&#10;João Santos&#10;Pedro - 0"></textarea>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem; align-self: flex-start;">
                            <button onclick="adicionar()">Adicionar</button>
                            <label style="font-size: 0.7rem; text-transform: none; letter-spacing: 0;">Padrão máx.:</label>
                            <select id="maxAcomp" class="form-select" style="padding: 0.5rem; font-size: 0.85rem;">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4" selected>4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita: Links Gerados -->
            <div class="card-col">
                <div class="card">
                    <div class="counter" id="counter">0 convidados</div>
                    <div class="row" style="margin-bottom: 0.8rem;">
                        <button onclick="copiarTodos()" class="gold">📋 Copiar todos</button>
                        <button onclick="limpar()" style="background: #888;">🗑️ Limpar tudo</button>
                    </div>
                    <div class="links-list" id="linksList">
                        <div class="empty">Nenhum convidado ainda. Adicione nomes acima.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="copied-toast" id="toast">Copiado!</div>

    <script>
        const baseUrlInput = document.getElementById('baseUrl');
        const namesInput = document.getElementById('namesInput');
        const linksList = document.getElementById('linksList');
        const counter = document.getElementById('counter');
        const toast = document.getElementById('toast');
        let convidados = [];

        const SB_URL = 'https://qhkcilqktcdevkkysovp.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoa2NpbHFrdGNkZXZra3lzb3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTk5NzksImV4cCI6MjEwMDMzNTk3OX0.gGg83qvinqHsZkdRacGYVRheCwawWeUKAHCiEpni9LU';

        function sbH() { return {
            'Content-Type': 'application/json',
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY
        };}

        function toastShow(m) {
            toast.textContent = m;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function buildLink(nome, max) {
            const base = baseUrlInput.value.trim().replace(/\/?$/, '/');
            return base + '?nome=' + encodeURIComponent(nome.trim()) + '&max=' + max;
        }

        // ---- CARREGAR ----
        async function carregar() {
            try {
                const r = await fetch(SB_URL + '/rest/v1/links_gerados?select=*&order=nome.asc', {
                    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
                });
                if (!r.ok) return;
                convidados = await r.json();
                render();
            } catch (e) {}
        }

        // ---- RENDER ----
        function render() {
            if (convidados.length === 0) {
                linksList.innerHTML = '<div class="empty">Nenhum convidado ainda. Adicione nomes acima.</div>';
                counter.textContent = '0 convidados';
                return;
            }
            counter.textContent = `${convidados.length} convidado${convidados.length > 1 ? 's' : ''}`;
            linksList.innerHTML = convidados.map((c, i) => {
                const params = new URLSearchParams(c.link.split('?')[1] || '');
                const max = params.get('max') || '4';
                return `
                <div class="link-item">
                    <span class="link-nome">${c.nome} <small style="color: var(--gold); font-weight: normal;">(máx ${max})</small></span>
                    <span class="link-url">${c.link}</span>
                    <button class="copy-btn" onclick="copiar(${c.id})">Copiar</button>
                    <button class="del-btn" onclick="deletar(${c.id})">✕</button>
                </div>
            `}).join('');
        }

        // ---- ADICIONAR ----
        async function adicionar() {
            const linhas = namesInput.value.split('\n').map(n => n.trim()).filter(n => n);
            if (linhas.length === 0) { toastShow('Digite pelo menos um nome'); return; }

            const defaultMax = document.getElementById('maxAcomp').value;
            const existentes = new Set(convidados.map(c => c.nome.toLowerCase().trim()));
            const novos = [];
            const ignorados = [];

            for (const linha of linhas) {
                // Parse: "Nome - 3" ou só "Nome"
                const match = linha.match(/^(.+?)\s*-\s*(\d+)$/);
                const nome = match ? match[1].trim() : linha;
                const max = match ? match[2] : defaultMax;
                const nomeLower = nome.toLowerCase();

                if (existentes.has(nomeLower)) {
                    ignorados.push(nome);
                } else {
                    novos.push({ nome, max });
                    existentes.add(nomeLower);
                }
            }

            if (ignorados.length > 0) {
                toastShow(`${ignorados.length} já existente${ignorados.length > 1 ? 's' : ''}: ${ignorados.join(', ')}`);
            }

            if (novos.length === 0) return;

            for (const item of novos) {
                await fetch(SB_URL + '/rest/v1/links_gerados', {
                    method: 'POST',
                    headers: sbH(),
                    body: JSON.stringify({ nome: item.nome, link: buildLink(item.nome, item.max) })
                }).catch(() => {});
            }

            namesInput.value = '';
            await carregar();
            toastShow(`${novos.length} adicionado${novos.length > 1 ? 's' : ''}!`);
        }

        // ---- COPIAR ----
        async function copiar(id) {
            const c = convidados.find(x => x.id === id);
            if (!c) return;
            try {
                await navigator.clipboard.writeText(c.link);
                toastShow('Link copiado!');
            } catch (e) {
                toastShow('Erro ao copiar');
            }
        }

        async function copiarTodos() {
            if (convidados.length === 0) { toastShow('Nenhum convidado'); return; }
            try {
                await navigator.clipboard.writeText(convidados.map(c => c.link).join('\n'));
                toastShow('Todos copiados!');
            } catch (e) {
                toastShow('Erro ao copiar');
            }
        }

        // ---- DELETAR ----
        async function deletar(id) {
            await fetch(SB_URL + '/rest/v1/links_gerados?id=eq.' + id, {
                method: 'DELETE',
                headers: sbH()
            }).catch(() => {});
            await carregar();
            toastShow('Removido');
        }

        // ---- LIMPAR ----
        async function limpar() {
            const ok = confirm('Limpar todos os convidados?');
            if (!ok) return;
            await fetch(SB_URL + '/rest/v1/links_gerados?id=neq.0', {
                method: 'DELETE',
                headers: sbH()
            }).catch(() => {});
            await carregar();
            toastShow('Tudo limpo');
        }

        // ---- EVENTOS ----
        namesInput.addEventListener('paste', () => setTimeout(adicionar, 100));
        carregar();
    </script>
</body>
</html>
